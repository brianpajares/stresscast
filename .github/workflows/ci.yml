name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + integration (incluye 20 golden vectors)
        run: npm run test
      - name: Engine parity Python vs TypeScript (78.125 combinaciones)
        run: npm run test:parity
      - name: Drive manifest (8/8 checksums)
        run: npx tsx scripts/drive-sync.ts --dry-run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3200
      - name: Lighthouse móvil (presupuesto >= 0.9 en las 4 categorías)
        run: |
          npm run start -- -p 3200 &
          npx wait-on http://localhost:3200/api/health
          npx @lhci/cli autorun --config=lighthouserc.json
        env:
          STORE_DRIVER: memory
          ALLOW_MEMORY_STORE: "true"
